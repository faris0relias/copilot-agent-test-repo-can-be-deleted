name: $(SourceBranch)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - tests/*
      - .azuredevops/*
      - .iac/*

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: content-library-service-gitops
      type: github
      endpoint: Relias-Github
      name: relias-engineering/content-library-service-gitops
    - repository: cortex-devops
      type: bitbucket
      endpoint: 'Relias-Bitbucket'
      name: relias/cortex-devops

variables:
  dotnetVersion: 8.0.x
  solutionRoot: $(Build.SourcesDirectory)
  testRoot: tests
  srcRoot: src
  iacRoot: .iac
  sonarCloudName: Relias SonarCloud-GH
  parameters.webApiClientSecret.value: $(WEBAPI_CLIENT_SECRET)
  Dockertoken: $(System.AccessToken)


stages:
  - stage: BuildAndUnitTest
    displayName: Build and Unit Test Solution
    jobs:
      - job: BuildAndUnitTest
        displayName: Build and Unit Test Solution
        steps:
          - task: UseDotNet@2
            displayName: Use .NET Core SDK $(dotnetVersion)
            inputs:
              version: $(dotnetVersion)

          - task: NuGetAuthenticate@1
            displayName: NuGet Authenticate

          - template: ./templates/dotnet-build-and-test.yml
            parameters:
              command: build
              devopsScriptsPath: $(solutionRoot)/.azuredevops/pipelines/scripts
              projects:
                - Relias.ContentLibraryService.Api
                - Relias.ContentLibraryService.Consumer
              srcRoot: $(srcRoot)
              sonarCloudName: $(sonarCloudName)
              sonarProjectKey: relias-engineering_content-library-service
              sonarProjectName: content-library-service
              testProjects:
                - Relias.ContentLibraryService.Api.Tests
                - Relias.ContentLibraryService.App.Tests
                - Relias.ContentLibraryService.Infra.Tests
                - Relias.ContentLibraryService.Consumer.Tests
                - Relias.ContentLibraryService.Integration.Tests
                - Relias.ContentLibraryService.Function.Tests
              testRoot: $(testRoot)
              artifactName: Unit

  - stage: BuildAndAttachDockerImages
    displayName: Build And Attach Docker Images
    dependsOn:
      - BuildAndUnitTest
    jobs:
      - job: BuildAndAttachDockerImages
        displayName: Build And Attach API Docker Images
        steps:
          - template: ./templates/docker-build.yml
            parameters:
              solutionRoot: $(solutionRoot)
              imageName: content-library-service-api
              tag: $(Build.BuildId)
              dockerFile: $(srcRoot)/Relias.ContentLibraryService.Api/Dockerfile
              laceworkAccount: relias
              laceworkPassword: $(LW_ACCESS_TOKEN)
              attachImage: true
              token: $(DockerToken)
              
  
  - stage: BuildAndAttachConsumerDockerImages
    displayName: Build And Attach Consumer Docker Images
    dependsOn:
      - BuildAndUnitTest
    jobs:
      - job: BuildAndAttachDockerImages
        displayName: Build And Attach Consumer Docker Images
        steps:
          - template: ./templates/docker-build.yml
            parameters:
              solutionRoot: $(solutionRoot)
              imageName: content-library-service-consumer
              tag: $(Build.BuildId)
              dockerFile: $(srcRoot)/Relias.ContentLibraryService.Consumer/Dockerfile
              laceworkAccount: relias
              laceworkPassword: $(LW_ACCESS_TOKEN)
              attachImage: true
              token: $(DockerToken)

  ### DEV Stages ###

  ### DEV - Docker Push to ACR ###
  - stage: PushDockerImagesToACR_Dev
    pool: $(agentPool)
    displayName: Push API Docker Images To ACR - Dev
    dependsOn:
      - BuildAndAttachDockerImages
    variables:
      - template: ./variables/infra-dev1.yml
    jobs:
      - job: PushDockerImageToACR
        displayName: Push Docker Images To ACR
        steps:
          - template: ./templates/docker-push-to-acr.yml
            parameters:
              imageName: content-library-service-api
              tag: $(Build.BuildId)
              acrServiceConnection: ${{variables.acrServiceConnection}}
              acrEndpoint: $(acrEndpoint)

  - stage: PushConsumerDockerImagesToACR_Dev
    pool: $(agentPool)
    displayName: Push Consumer Docker Images To ACR - Dev
    dependsOn:
      - BuildAndAttachConsumerDockerImages
    variables:
      - template: ./variables/infra-dev1.yml
    jobs:
      - job: PushDockerImageToACR
        displayName: Push Docker Images To ACR
        steps:
          - template: ./templates/docker-push-to-acr.yml
            parameters:
              imageName: content-library-service-consumer
              tag: $(Build.BuildId)
              acrServiceConnection: ${{variables.acrServiceConnection}}
              acrEndpoint: $(acrEndpoint)

  ### DEV1 Infra Stages ###
  - stage: DeployInfra_Dev1
    pool: $(agentPool)
    displayName: Deploy Infra - Dev1
    dependsOn:
      - PushDockerImagesToACR_Dev
    variables:
      - template: ./variables/infra-dev1.yml
    jobs:
      - job: DeployInfra
        displayName: Deploy Infra - Dev1
        steps:
          - template: ./templates/infra-deploy.yml
            parameters:
              iacRoot: $(iacRoot)
              azureResourceManagerConnection: ${{variables.azureResourceManagerConnection}}

  - stage: Persistent_Dev1
    displayName: SQL Setup - Dev1
    dependsOn:
      - DeployInfra_Dev1
    variables:
      - template: ./variables/infra-dev1.yml
    jobs:
      - template: ./templates/persistent.yml
        parameters:
          connectedServiceNameARM: ${{ variables.connectedServiceNameARM }}
          agentPool: ${{ variables.agentPool }}

  - stage: UpdateFlux_Dev1
    displayName: Update Flux Dev1
    dependsOn:
      - DeployInfra_Dev1
    variables:
      - template: ./variables/infra-dev1.yml
      - template: ./variables/cortex.yml
    jobs:
      - job: UpdateFluxWebApi
        displayName: Update Flux - webapi - Dev1
        steps:
          - template: ./templates/flux-update.yml
            parameters:
              overlayFiles: 'content-library-service-api-deployment.yaml,content-library-service-consumer-deployment.yaml'
              gitopsRepo: content-library-service-gitops
              branch: main
      - template: azure-devops/send-deployment-metrics.yaml@cortex-devops
        parameters:
          entityTag: ${{variables.entityTag}}
          serviceName: ${{variables.serviceName}}
          environment: ${{variables.targetEnv}}
          organization: ${{variables.organization}}
          project: ${{variables.project}}
          jobDependency: UpdateFluxWebApi
          appType: ${{variables.appType}}

  ### DEV2 Infra Stages ###
  - stage: DeployInfra_Dev2
    pool: $(agentPool)
    displayName: Deploy Infra - Dev2
    dependsOn:
      - PushDockerImagesToACR_Dev
    variables:
      - template: ./variables/infra-dev2.yml
    jobs:
      - job: DeployInfra
        displayName: Deploy Infra - Dev2
        steps:
          - template: ./templates/infra-deploy.yml
            parameters:
              iacRoot: $(iacRoot)
              azureResourceManagerConnection: ${{variables.azureResourceManagerConnection}}

  - stage: Persistent_Dev2
