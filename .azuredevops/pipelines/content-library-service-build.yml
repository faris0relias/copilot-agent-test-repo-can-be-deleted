        steps:
          - template: ./templates/flux-update.yml
            parameters:
              overlayFiles: 'content-library-service-api-deployment.yaml,content-library-service-consumer-deployment.yaml'
              gitopsRepo: content-library-service-gitops
              branch: main
      - template: azure-devops/send-deployment-metrics.yaml@cortex-devops
        parameters:
          entityTag: ${{variables.entityTag}}
          serviceName: ${{variables.serviceName}}
          environment: ${{variables.targetEnv}}
          organization: ${{variables.organization}}
          project: ${{variables.project}}
          jobDependency: UpdateFluxWebApi
          appType: ${{variables.appType}}

  # ### Staging Stages ###

  ### Staging Approval Gate ###
  - stage: Staging_Approval_Gate
    displayName: Staging Approval Gate
    dependsOn:
      - UpdateFlux_Dev1
      - UpdateFlux_Dev2
    jobs:
      - deployment: Approved
        environment: cls-stg-gate
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

  ### STG-US - Docker Push to ACR ###
