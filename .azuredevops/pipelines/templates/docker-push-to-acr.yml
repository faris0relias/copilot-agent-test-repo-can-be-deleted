parameters:
  - name: imageName
    type: string
  - name: tag
    type: string
  - name: acrServiceConnection
    type: string
  - name: acrEndpoint
    type: string

steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download Artifact - ${{parameters.imageName}}_${{parameters.tag}}
    inputs:
      artifact: ${{parameters.imageName}}_${{parameters.tag}}
      targetPath: $(System.ArtifactsDirectory)

  - bash: |
      docker load -i $(System.ArtifactsDirectory)/${{parameters.imageName}}_${{parameters.tag}}.tar
      docker tag ${{parameters.imageName}}:${{parameters.tag}} ${{parameters.acrEndpoint}}/${{parameters.imageName}}:${{parameters.tag}}
      docker images
    displayName: Docker Load and Tag - ${{parameters.imageName}}:${{parameters.tag}}
    
  - task: Docker@2
    displayName: Docker Push to ACR - ${{parameters.imageName}}:${{parameters.tag}}
    inputs:
      containerRegistry: ${{parameters.acrServiceConnection}}
      repository: ${{parameters.imageName}}
      command: push
      tags: |
        ${{parameters.tag}}
